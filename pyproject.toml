[project]
name = "clippings"
version = "0.1.0.dev0"
description = "A configurable multi-source news digest: one product, one YAML file per audience, with cited summaries, verbatim-verified quotes, and measured precision and recall."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Every model call goes through the portfolio gateway (PLAN.md section 2.3); cost per digest
  # comes from its ledger. From 0.35 for three things this project uses: `data_class` on every
  # call (0.4, so each row says `public`), the per-day cap (0.30, which bounds a scheduler
  # retry loop), and the packaged 2026-10-01 price list (`prices: builtin`). 1.2 for the
  # 2026-10-08 price list, which prices Claude Haiku 5.5, the re-ranker since 2026-10-10.
  # Below 2 because the gateway removes or renames nothing within a major version.
  "boundary>=1.2,<2",
  # The pipeline graph (PLAN.md section 4): fetch to publish as nodes, with the verify and
  # repair loop as an edge rather than a while loop. The 0.x line project 13 uses; a major
  # bump changes the StateGraph API the graph is written against.
  "langgraph>=0.6,<1",
  # Audience schema, source records and digest models. The audience file is the product, so its
  # validation is not optional.
  "pydantic>=2,<3",
  # Audience files, source registry and the terms record are YAML. 6.x is the only maintained line.
  "pyyaml>=6,<7",
  # One HTTP client for feeds, GDELT, Reddit, Bluesky and X. Below 1.0 because a major bump changes
  # defaults (timeouts, redirects, HTTP/2) that the politeness rules in sources/ depend on.
  "httpx>=0.28,<1",
  # RSS and Atom parsing. 6.x has handled the decade of malformed feeds in the wild; the
  # alternative is parsing XML by hand against publishers who do not validate theirs.
  "feedparser>=6,<7",
  # One database file per environment: items, clusters, scores, digests, watermarks, the run
  # lock. 1.x is the stable line and the file format is stable within it.
  "duckdb>=1,<2",
  # Article text extraction, only from pages that allow it (PLAN.md section 2.2). Below 2.0
  # because extraction output changes between majors and the thirty-day store would mix formats.
  "trafilatura>=2,<3",
  # Command line: clippings run | label | eval | report | render. 0.x is the only line.
  "typer>=0.15,<1",
  # The measurement statistics (PLAN.md section 2.6): bootstrap and Jeffreys intervals from the
  # 03 gate's published `drift.analysis.stats`, imported rather than reimplemented, so this
  # project's intervals are computed exactly as the gate's are. Pinned to 03's v0.1.0 tag.
  "drift",
]

[project.optional-dependencies]
# Story clustering by local sentence embeddings (bge-small, CPU). ONNX rather than torch: the
# Cloud Run job image stays small and the CPU path is the only one this project ever uses.
# An extra so CI and the test suite never download a model; tests use the hashing backend.
embed = ["fastembed>=0.7,<1"]
# The DuckDB file is synchronised to a Cloud Storage bucket in production. An extra so local
# development and CI run against the filesystem backend with no cloud credentials.
gcs = ["google-cloud-storage>=3,<4"]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
  # Mocks the httpx transport so every source adapter has golden requests and responses and no
  # test ever reaches a publisher.
  "respx>=0.22,<1",
]

[tool.uv.sources]
# Pinned to the tag, not a branch, so the lockfile resolves to one commit and the price list
# a digest was costed at is the one this checkout names.
boundary = { git = "https://github.com/Peter-A-P/compliant-ai-gateway", tag = "v1.2.0" }
drift = { git = "https://github.com/Peter-A-P/ai-release-gate", tag = "v0.1.0" }

[tool.uv]
# 03 v0.1.0 declares boundary below 0.3, the line it was built on; this project runs 1.2. The
# only 03 module imported here is drift.analysis.stats, which is plain Python and never touches
# boundary, so the gateway this project actually calls is the one that governs.
override-dependencies = ["boundary>=1.2,<2"]

[project.scripts]
clippings = "clippings.cli:app"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clippings"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python code blocks inside Markdown by default; the plan and the docs keep their
# own layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
  # Line length is handled by the formatter.
  "E501",
  # RunLockHeld and the rest read as the conditions they are; an Error suffix would make
  # the call sites worse, and the same choice is made in the 04 gateway.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["clippings", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# feedparser and trafilatura ship no stubs; fastembed and google.cloud are behind optional
# extras and are deliberately absent from the development environment, so the Cloud Storage
# and embedding backends are type-checked against their call sites rather than their
# libraries. The `type: ignore[attr-defined]` comments in remote.py are that trade made
# visible.
module = [
  "feedparser",
  "trafilatura",
  "fastembed",
  "respx",
  "respx.*",
  "google.*",
  "google.cloud.*",
  "google.api_core.*",
  "langgraph",
  "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# langgraph imports a langchain serializer that warns about a default it does not use: no
# checkpointer is configured, so nothing is ever serialised.
filterwarnings = ["ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning"]

[[tool.mypy.overrides]]
# 03's package is typed throughout and checked with mypy --strict in its own CI, but ships no
# py.typed marker; follow it rather than treat its estimates as Any.
module = ["drift.*", "gate.*"]
follow_untyped_imports = true
