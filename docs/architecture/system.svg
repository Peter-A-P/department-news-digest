<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="1010" viewBox="0 0 1244 1010" role="img" aria-label="A daily Cloud Run job fetches only sources whose terms have been read and dated, stores items with watermarks and thirty-day retention, collapses near-duplicates and clusters stories by meaning, ranks them per audience and re-ranks the top with a model, writes cited summaries that a verifier holds to verbatim quotes, and publishes a page per audience; labelling and the report measure precision and recall against a hand-labelled week." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
