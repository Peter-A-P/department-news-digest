# Example audience: municipal affairs in one large city.
#
# Toronto, chosen because it is large, its council papers and newsroom are public, and it
# is plainly not the employer's jurisdiction (PLAN.md section 2.1).
#
# Every `terms` key below must appear in docs/sources.md with a date read and status
# `allowed`, or the fetcher refuses the source. Run `clippings sources check`.

id: municipal-toronto
name: Municipal affairs, Toronto
description: >-
  City of Toronto council and committee decisions, the municipal budget, transit, housing
  and development approvals, the municipal election, and the provincial decisions and
  regional economic news that land on the city.

# The first day made under the rubric that counts the election and the regional economy
# (2026-10-13); relevance is measured from here. On 2026-10-11 and 2026-10-12 the old rubric,
# written for council decisions only, scored every election story 1 ("no decision") while
# Peter marked a mayoral poll, candidacy news and the city's Kids Vote campaign must-read:
# precision 33%, must-read recall 25%.
measure_from: "2026-10-13"

rubric: >-
  Relevant means an item someone following Toronto's city government would want to know
  this morning: council and committee decisions and the items coming to them, budget and
  property tax decisions, transit service and capital projects, housing supply and
  development approvals, labour negotiations with city unions, service disruptions of city
  scale, and provincial or federal decisions that change the city's money or powers. The
  municipal election counts in full, with no decision needed: polls, candidates entering,
  leaving or staying in a race, platforms and debates, and how, when and where residents
  vote, including the city's own voter and civic-education campaigns. So do regional
  economic events large enough to touch the city: major layoffs, closures or investments
  in the Toronto and Hamilton area, and housing market and affordability figures. Trends
  the city is answerable for, such as road deaths or shelter capacity, count even without a
  decision. It excludes routine crime and collision reports, weather, sport, restaurant and
  culture listings, and neighbourhood items with no decision attached.

topics:
  - Toronto city council
  - Toronto municipal election
  - municipal budget
  - property tax
  - transit service and expansion
  - housing supply
  - development approvals
  - municipal labour relations
  - provincial municipal funding

entities:
  organisations:
    - City of Toronto
    - Toronto Transit Commission
    - Toronto City Council
    - Metrolinx
    - Government of Ontario
  people: []
  places:
    - Toronto
    - Ontario

geography:
  - Toronto
  - Ontario

languages:
  - en

sources:
  feeds:
    - url: https://www.cbc.ca/webfeed/rss/rss-canada-toronto
      publisher: CBC News, Toronto
      terms: cbc.ca
    - url: https://www.toronto.ca/news/feed/
      publisher: City of Toronto newsroom
      terms: toronto.ca
    - url: https://toronto.citynews.ca/feed/
      publisher: CityNews Toronto
      terms: citynews.ca

  gdelt:
    queries:
      - 'Toronto (council OR budget OR transit OR housing)'
      - '"City of Toronto"'
    limit: 75

  bluesky:
    queries:
      - Toronto council
      - TTC
    # People whose own posts are candidates for the day's Bluesky post: the Toronto Star's
    # city hall reporters and city columnists; no candidates before the 2026-10-26 election.
    # Handles checked against Bluesky on 2026-10-13. Their posts join a story only
    # when they are about one, like any other post.
    people:
      - benspurr.bsky.social
      - alyshah.bsky.social
      - dmrider.bsky.social
      - graphicmatt.com
      - shawnmicallef.bsky.social
    limit: 50
  # One X post a day, shown whole on its day only (rank/x_pick.py), from the Toronto Star's
  # city hall reporters and city columnists. Not outlets, whose posts share the reports this
  # digest already has from their feeds, and, until the 2026-10-26 election, no
  # candidates: a list holding some of them would favour those. Handles checked against X
  # on 2026-10-13. Ten candidates is about US$0.06 a day. Leave the query empty for an
  # audience that serves a government body: X requires an Enterprise plan for that.
  x:
    query: 'from:BenSpurr OR from:dmrider OR from:GraphicMatt OR from:shawnmicallef'
    candidates: 10

trusted_sources:
  - toronto.ca
  - ttc.ca
  - news.ontario.ca
  - cbc.ca

blocked_sources: []

digest:
  max_stories: 10
  rerank_candidates: 60
  max_sentences_per_story: 3
  # Marginal stories left out (2026-10-10). Peter's first four labelled days: 15 of 21 marginal stories relevant against 18 of 19 scored relevant or must read.
  # A quiet day is a shorter digest rather than one padded with filler.
  min_rubric_score: 2

delivery:
  time_local: "07:00"
  timezone: America/Toronto
