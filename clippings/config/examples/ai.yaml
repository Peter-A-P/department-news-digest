# Example audience: artificial intelligence, broadly.
#
# Not the employer's. A generic audience over public sources, shipped so a reader can see
# what configuring a department looks like (PLAN.md section 2.1).
#
# Widened on 2026-10-07 from "AI policy and regulation". The policy-only version kept one
# story of 27 on its first deployed day: its feeds were government newsrooms where AI is a
# rare subject, so the rubric excluded nearly everything. This one reads the AI desks of
# technology publishers and the labs' own blogs, and its rubric draws the line Peter asked
# for: AI must be what the item is about, not something it mentions. Most large technology
# publishers' terms now forbid this use (docs/sources.md), so it leans on the labs' own
# blogs, GDELT, Bluesky and X, and on whichever desks clear a reading.
#
# Raised on 2026-10-10 from "about AI" to "important in AI". Labelling the first day, Peter
# found the digest in the weeds: small startups' funding rounds and routine model releases
# (Hugging Face publishes hundreds) were relevant under the old rubric and worthless to the
# reader it is for, a busy person who wants the week's important developments. The rubric
# now sets a significance bar. Relevance is measured from `measure_from`, the first day made
# under this rubric.
#
# Softened on 2026-10-10 after the first labelled day: the breadth rule ("only a specialist
# reports it, so rarely important") cut six stories Peter judged relevant, all TechCrunch
# only (OpenAI's revenue shortfall, the fired safety researchers, Anthropic's usage policy).
# Breadth is now supporting evidence, not a bar, and empty slots are filled.
#
# Every `terms` key below must appear in docs/sources.md with a date read and status
# `allowed`, or the fetcher refuses the source. Run `clippings sources check`.

id: ai
name: Artificial intelligence
description: >-
  The most important developments in artificial intelligence, for busy readers who want to
  stay informed without following the field day to day: frontier models and research that
  move the state of the art, major products and deployments, the biggest deals and moves in
  the industry, chips and compute, law and regulation, serious safety and security
  incidents, and measured effects on work and society.

measure_from: "2026-10-11"

rubric: >-
  Relevant means a development a busy, well-informed reader would regret missing: it changes
  what AI can do, who leads the field, what AI costs, how it is governed, or how it is used
  at scale, and it matters beyond the company that announced it. AI must be the story: take
  AI out and there is no story. That includes frontier model releases and research results
  that clearly move the state of the art or that very many people will use; major products
  and deployments at scale; funding rounds, valuations and acquisitions of about a billion
  dollars or more, or involving the leading AI companies; leadership changes and large
  layoffs at the leading AI companies; significant moves in AI chips, data centres and
  compute; law, regulation, enforcement, major litigation and standards about AI; serious
  safety and security incidents involving AI systems; and measured effects of AI on work,
  education, science and public services. Coverage by general news outlets, or by several
  independent outlets, is supporting evidence that a story matters; a story reported by one
  specialist publication can still matter on its own merits, so judge it by what happened,
  not by who reported it. It excludes routine funding rounds, valuations
  and launches of small and mid-sized startups; routine model releases, fine-tunes,
  checkpoints, datasets, library updates and benchmark posts, including most Hugging Face
  releases, unless the model sets a clear new state of the art or is being widely adopted;
  customer case studies and vendor marketing; minor product features and updates; items
  that mention AI in passing while being about something else; deals, discounts and
  shopping guides; how-to guides, tutorials and listicles; opinion without new facts; and
  event promotion.

topics:
  - AI models and research
  - AI products and deployment
  - AI companies and investment
  - AI chips and compute
  - AI regulation and policy
  - AI safety and security
  - AI and work
  - AI and copyright

entities:
  organisations:
    - OpenAI
    - Anthropic
    - Google DeepMind
    - Meta
    - Microsoft
    - Nvidia
    - Mistral AI
    - xAI
    - European Commission
    - NIST
    - UK AI Security Institute
  people: []
  places: []

geography: []

languages:
  - en

sources:
  feeds:
    # Technology desks' AI sections. MIT Technology Review, The Verge, Ars Technica, Wired
    # and The Guardian were tried and dropped on 2026-10-07: their terms forbid automated
    # processing or AI use of their content (docs/sources.md). TechCrunch is pending a
    # reading of its RSS terms and is feed-only if allowed: they permit displaying what the
    # feed carries, so no article page is requested.
    - url: https://techcrunch.com/category/artificial-intelligence/feed/
      publisher: TechCrunch
      terms: techcrunch.com
      extract: false
    - url: https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss
      publisher: IEEE Spectrum
      terms: spectrum.ieee.org
    # The labs' own announcements: primary sources for releases and research, and the
    # re-ranker decides whether a given post is news.
    - url: https://openai.com/news/rss.xml
      publisher: OpenAI
      terms: openai.com
    - url: https://deepmind.google/blog/rss.xml
      publisher: Google DeepMind
      terms: deepmind.google
    - url: https://blog.google/technology/ai/rss/
      publisher: Google
      terms: blog.google
    - url: https://huggingface.co/blog/feed.xml
      publisher: Hugging Face
      terms: huggingface.co
    # General news desks, added 2026-10-10. They carry AI only when it is big, which is the
    # point: a story they report beside the specialists is evidence of importance, and the
    # re-ranker is shown who reported each story. CBC's terms are already read and allowed.
    - url: https://www.cbc.ca/webfeed/rss/rss-technology
      publisher: CBC News, Technology and Science
      terms: cbc.ca
    - url: https://www.cbc.ca/webfeed/rss/rss-business
      publisher: CBC News, Business
      terms: cbc.ca
    # Kept from the policy audience: regulation is still part of the subject.
    - url: https://digital-strategy.ec.europa.eu/en/rss.xml
      publisher: European Commission, Shaping Europe's digital future
      terms: ec.europa.eu
    - url: https://www.nist.gov/news-events/news/rss.xml
      publisher: National Institute of Standards and Technology
      terms: nist.gov

  # Anthropic posts news with no feed; its sitemap lists every page with a date
  # (clippings/sources/sitemap.py).
  sitemaps:
    - url: https://www.anthropic.com/sitemap.xml
      publisher: Anthropic
      terms: anthropic.com
      include: /news/

  # One query rather than two since 2026-10-26: GDELT refuses most requests from Cloud Run's
  # shared addresses, so every request saved is a better chance for the rest. The other
  # audiences' pairs cannot be joined, because GDELT takes OR only inside one level of
  # parentheses.
  gdelt:
    queries:
      - '("artificial intelligence" OR "large language model" OR "generative AI")'
    limit: 75

  bluesky:
    queries:
      - AI model release
      - AI regulation
    # People whose own posts are candidates for the day's Bluesky post: lab-adjacent
    # researchers, critics and AI reporters.
    # Handles checked against Bluesky on 2026-10-13. Their posts join a story only
    # when they are about one, like any other post.
    people:
      - garymarcus.bsky.social
      - emollick.bsky.social
      - melaniemitchell.bsky.social
      - mmitchell.bsky.social
      - emilymbender.bsky.social
      - timnitgebru.blacksky.app
      - randomwalker.bsky.social
      - simonwillison.net
      - karenhao.bsky.social
      - caseynewton.bsky.social
      - hlntnr.bsky.social
      - katecrawford.bsky.social
    limit: 50
  # One X post a day, shown whole on its day only (rank/x_pick.py). Two searches. The
  # first names people in their public roles, lab leaders, researchers, policy people and
  # two journalists, and the four largest labs' own accounts; not outlets, whose posts
  # share the reports this digest already has from their feeds. The second searches by
  # subject for the day's popular posts from people nobody listed. Fifteen people and ten
  # posts left 2026-10-15 with no pick, and Peter chose fifty posts a day: thirty from the
  # people and twenty by subject, about US$0.25 a day. Handles checked against X's user
  # lookup on 2026-10-13 and 2026-10-15. Leave both empty for an audience that serves a
  # government body: X requires an Enterprise plan for that (docs/sources.md).
  x:
    query: 'from:sama OR from:gdb OR from:DarioAmodei OR from:jackclarkSF OR from:demishassabis OR from:JeffDean OR from:mustafasuleyman OR from:karpathy OR from:AndrewYNg OR from:ylecun OR from:fchollet OR from:emollick OR from:GaryMarcus OR from:Miles_Brundage OR from:hlntnr OR from:OpenAI OR from:AnthropicAI OR from:GoogleDeepMind OR from:AIatMeta OR from:simonw OR from:natolambert OR from:drfeifei OR from:kevinroose OR from:ClementDelangue OR from:polynoamial'
    candidates: 30
    # The day's popular posts by subject, from people nobody listed (Peter, 2026-10-15).
    topics: '"AI model" OR "AI agents" OR "frontier AI" OR "open weights" OR "AI safety" OR "AI regulation" OR OpenAI OR Anthropic OR DeepMind OR ChatGPT OR Claude OR Gemini OR LLM'
    topic_candidates: 20

trusted_sources:
  - spectrum.ieee.org
  - ec.europa.eu
  - nist.gov

blocked_sources: []

digest:
  max_stories: 10
  rerank_candidates: 60
  max_sentences_per_story: 3
  # 1, not 2 (2026-10-10): on the first labelled day the digest left four slots empty while
  # Peter judged nine left-out stories relevant, all scored "marginal" by the model. The
  # rubric keeps out what he asked to keep out; marginal stories only fill what is left.
  min_rubric_score: 1
  # Two Bluesky and two X posts a day (Peter, 2026-10-15): X reads fifty posts for AI, and
  # one pick from that pool left good posts unshown.
  post_picks: 2

delivery:
  time_local: "07:00"
  timezone: America/Toronto
