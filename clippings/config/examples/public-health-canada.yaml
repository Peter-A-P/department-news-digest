# Example audience: public health in Canada.
#
# Not the employer's. A generic audience over public sources (PLAN.md section 2.1).
#
# Every `terms` key below must appear in docs/sources.md with a date read and status
# `allowed`, or the fetcher refuses the source. Run `clippings sources check`.

id: public-health-canada
name: Public health in Canada
description: >-
  Communicable disease activity, immunisation, drug and device safety, health system
  capacity and public health policy across Canadian federal, provincial and territorial
  authorities.

# The first day made under min_rubric_score 2; relevance is measured from here.
measure_from: "2026-10-11"

rubric: >-
  Relevant means an item a public health communications officer would need before the
  morning meeting: outbreak and surveillance reporting, immunisation programme changes,
  drug and medical device recalls and safety advisories, public health guidance issued or
  withdrawn, health system capacity and emergency department status, and funding or policy
  decisions that change what a health authority does. It excludes individual clinical case
  reports, wellness and lifestyle features, hospital human interest stories, and
  pharmaceutical company announcements with no regulatory or programme consequence.

topics:
  - communicable disease outbreaks
  - immunisation programmes
  - drug and device recalls
  - public health guidance
  - health system capacity
  - emergency department closures
  - public health funding

entities:
  organisations:
    - Public Health Agency of Canada
    - Health Canada
    - Canadian Institute for Health Information
    - National Advisory Committee on Immunization
    - BC Centre for Disease Control
    - Public Health Ontario
  people: []
  places:
    - Canada
    - Ontario
    - British Columbia
    - Quebec
    - Alberta

geography:
  - Canada

languages:
  - en

sources:
  feeds:
    - url: https://www.cbc.ca/webfeed/rss/rss-health
      publisher: CBC News, health
      terms: cbc.ca
    - url: https://api.io.canada.ca/io-server/gc/news/en/v2?sort=publishedDate&orderBy=desc&pick=50&format=atom
      publisher: Government of Canada newsroom
      terms: canada.ca
    - url: https://www.cmaj.ca/rss/current.xml
      publisher: Canadian Medical Association Journal
      terms: cmaj.ca

  gdelt:
    queries:
      - 'Canada (outbreak OR immunization OR "public health")'
      - '"Public Health Agency of Canada"'
    limit: 75

  reddit:
    subreddits:
      - canada
      - Epidemiology
    listing: new
    limit: 50

  bluesky:
    queries:
      - Canada public health
      - PHAC outbreak
    # People whose own posts are candidates for the day's Bluesky post: infectious disease
    # physicians, epidemiologists and a health columnist.
    # Handles checked against Bluesky on 2026-10-13. Their posts join a story only
    # when they are about one, like any other post.
    people:
      - isaacbogoch.bsky.social
      - deonandan.bsky.social
      - furnesscolin.bsky.social
      - picardonhealth.bsky.social
      - moriartylab.bsky.social
      - kashprime.bsky.social
    limit: 50
  # X is off for this audience (2026-10-13). Much of Canada's health and science community
  # has moved to Bluesky; of the people looked up, only the Chief Public Health Officer,
  # Health Canada, one columnist and one physician were active on X, and one other account
  # is marked inactive. Bluesky carries this audience's discussion.
  x:
    query: ''
    candidates: 10

trusted_sources:
  - canada.ca
  - cihi.ca
  - cmaj.ca
  - publichealthontario.ca
  - bccdc.ca

blocked_sources: []

digest:
  max_stories: 10
  rerank_candidates: 60
  max_sentences_per_story: 3
  # Marginal stories left out (2026-10-10). Peter's first four labelled days: 7 of 13 marginal stories relevant against 16 of 18 scored relevant or must read.
  # A quiet day is a shorter digest rather than one padded with filler.
  min_rubric_score: 2

delivery:
  time_local: "07:00"
  timezone: America/Toronto
